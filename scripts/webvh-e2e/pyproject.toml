[tool.poetry]
name = "traction-webvh-e2e"
version = "0.1.0"
description = "End-to-end HTTP harness for did:webvh flows against the Traction tenant proxy"
authors = ["BC Government <digital.trust@gov.bc.ca>"]
readme = "README.md"
package-mode = false
requires-poetry = "==2.5.2"

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.34.2"
python-dotenv = "^1.2.4"
click = ">=8.5.1,<9"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

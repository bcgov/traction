name: Helm Chart Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate-release-ref:
    name: Validate Release Ref
    runs-on: ubuntu-latest
    if: github.repository_owner == 'bcgov'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release tag matches the chart appVersion
        run: |
          app_version="$(yq e '.appVersion' charts/traction/Chart.yaml)"
          if [[ "$GITHUB_REF" != "refs/tags/v${app_version}" ]]; then
            echo "::error::Release ref $GITHUB_REF does not match chart appVersion $app_version"
            exit 1
          fi

  publish-images:
    name: Publish Release Images
    if: github.repository_owner == 'bcgov'
    needs: [ validate-release-ref ]
    uses: ./.github/workflows/release_assets.yaml
    permissions:
      contents: read
      packages: write

  # Sometimes chart-releaser might fetch an outdated index.yaml from gh-pages, causing a WAW hazard on the repo
  # This job checks the remote file is up to date with the local one on release
  validate-chart-index:
    name: Validate Chart Index
    runs-on: ubuntu-latest
    if: github.repository_owner == 'bcgov'
    needs: [ publish-images ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
      - name: Download remote index file and check equality
        run: |
          curl -vsSL https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.yaml > index.yaml.remote
          LOCAL="$(md5sum < index.yaml)"
          REMOTE="$(md5sum < index.yaml.remote)"
          echo "$LOCAL" = "$REMOTE"
          test "$LOCAL" = "$REMOTE"

  chart-release:
    name: Create and Publish Chart Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'bcgov'
    needs: [ validate-chart-index ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Add repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add owf https://openwallet-foundation.github.io/helm-charts/
      - name: Build chart dependencies
        run: helm dependency build charts/traction
      - name: Release workload charts
        uses: ./.github/actions/chart_releaser
        with:
          config: .github/cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  update-configs-and-sync:
    runs-on: ubuntu-latest
    name: Update Configs and Sync
    needs:
      - chart-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout services directory from the ministry-gitops-ditp repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bcgov-c/ministry-gitops-ditp
          ssh-key: ${{ secrets.DITP_GITOPS_REPO_SECRET }}
          sparse-checkout: |
            services
          path: ministry-gitops-ditp

      - name: Verify the released chart is available
        id: chart_version
        run: |
          app_version="$(yq e '.appVersion' charts/traction/Chart.yaml)"
          chart_version="$(yq e '.version' charts/traction/Chart.yaml)"
          helm repo add traction https://bcgov.github.io/traction
          for attempt in {1..6}; do
            helm repo update traction
            if helm search repo traction/traction --version "$chart_version" -o json |
              jq -e --arg version "$chart_version" --arg app "$app_version" \
                'any(.[]; .version == $version and .app_version == $app)' >/dev/null; then
              echo "APP_VERSION=$app_version" >> "$GITHUB_OUTPUT"
              echo "CHART_VERSION=$chart_version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for chart $chart_version and app $app_version (attempt $attempt/6)"
            sleep 10
          done
          echo "::error::Chart $chart_version with appVersion $app_version is not available in the public index"
          exit 1

      - name: Update test
        env:
          APP_VERSION: ${{ steps.chart_version.outputs.APP_VERSION }}
          CHART_VERSION: ${{ steps.chart_version.outputs.CHART_VERSION }}
        run: |
          cd ministry-gitops-ditp
          yq e -i '.appVersion = env(APP_VERSION)' services/traction/charts/test/Chart.yaml
          yq e -i '.version = env(CHART_VERSION)' services/traction/charts/test/Chart.yaml
          yq e -i '.dependencies[0].version = env(CHART_VERSION)' services/traction/charts/test/Chart.yaml

      - name: Update prod
        env:
          APP_VERSION: ${{ steps.chart_version.outputs.APP_VERSION }}
          CHART_VERSION: ${{ steps.chart_version.outputs.CHART_VERSION }}
        run: |
          cd ministry-gitops-ditp
          yq e -i '.appVersion = env(APP_VERSION)' services/traction/charts/prod/Chart.yaml
          yq e -i '.version = env(CHART_VERSION)' services/traction/charts/prod/Chart.yaml
          yq e -i '.dependencies[0].version = env(CHART_VERSION)' services/traction/charts/prod/Chart.yaml

      - name: Commit and Push to ministry-gitops-ditp Repo
        run: |
          cd ministry-gitops-ditp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add services/traction/charts/test/Chart.yaml services/traction/charts/prod/Chart.yaml
          git commit -m "Update chart and app versions" || echo "No changes to commit"
          git push origin main

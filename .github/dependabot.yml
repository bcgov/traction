# For details on how this file works refer to:
#  - https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  #  - Check for updates once a week
  #  - Group all updates into a single PR
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Canada/Pacific"
    groups:
      all-actions:
        patterns: ["*"]

  # Maintain dependencies for Python Packages
  - package-ecosystem: "pip"
    directories: ["/plugins/traction_innkeeper", "/scripts/webvh-e2e"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Canada/Pacific"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "acapy-agent"
      - dependency-name: "multitenant-provider"
      - dependency-name: "connections"
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Maintain dependencies for TypeScript and JavaScript
  - package-ecosystem: "npm"
    directory: "/services/tenant-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Canada/Pacific"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      node-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Maintain dependencies for TypeScript and JavaScript
  - package-ecosystem: "npm"
    directory: "/services/tenant-ui/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Canada/Pacific"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Maintain dependencies for dev Container
  - package-ecosystem: "devcontainers"
    directory: "/plugins"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Canada/Pacific"

  # Maintain dependencies for dev Container
  - package-ecosystem: "devcontainers"
    directory: "/services/tenant-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Canada/Pacific"

  # Maintain dependencies for docker
  - package-ecosystem: "docker"
    directories:
      - "/plugins/.devcontainer"
      - "/plugins/docker"
      - "/plugins/traction_innkeeper/docker"
      - "/services/tenant-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Canada/Pacific"
    ignore:
      - dependency-name: "*acapy-agent"
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "mcr.microsoft.com/devcontainers/python"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: "docker-compose"
    directories: ["/scripts", "/plugins/.devcontainer"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Canada/Pacific"
    ignore:
      - dependency-name: "*acapy-agent"
      - dependency-name: "traction"
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: "helm"
    directory: "/charts/traction"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Canada/Pacific"

    ignore:
      - dependency-name: "*traction-*"
      - dependency-name: "*acapy-agent"
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      chart-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
